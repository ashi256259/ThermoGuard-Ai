version: '3.8'

services:
  # 1. PostgreSQL with PostGIS Spatial Extension
  postgis:
    image: postgis/postgis:16-3.4
    container_name: thermoguard-postgis
    environment:
      POSTGRES_DB: thermoguard_db
      POSTGRES_USER: thermoguard
      POSTGRES_PASSWORD: guard_secure
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermoguard -d thermoguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Geospatial Intelligence Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: thermoguard-backend
    environment:
      DATABASE_URL: postgresql://thermoguard:guard_secure@postgis:5432/thermoguard_db
      DATA_MODE: DEMO
      FIRMS_API_URL: https://firms.modaps.eosdis.nasa.gov/api
      FIRMS_API_KEY: ${FIRMS_API_KEY:-}
      OSM_API_URL: https://overpass-api.de/api/interpreter
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy

  # 3. React + Leaflet GIS Intelligence Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: thermoguard-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
